run_name: gpu_pubmedqa_2b
seed: 13
output_dir: results/gpu_pubmedqa_2b_full
data:
  path: data/cases/pubmedqa_300.jsonl
  dataset: pubmedqa
  limit: 300
  max_options: 10
backend:
  type: hf
  hf:
    device_map: auto
    dtype: auto
    load_in_4bit: true
    trust_remote_code: false
    max_loaded_models: 1
  ollama:
    host: http://localhost:11434
    timeout: 300
  mock:
    skill: 0.65
    signal_strength: 2.0
    forecast_own_weight: 0.0
    forecast_noise: 0.1
    decoy_strength: 2.4
    pressure_strength: 3.2
    prevalence_weight: 0.3
team:
  agents: 5
  models:
  - Qwen/Qwen2.5-1.5B-Instruct
  roles:
  - attending physician
  - internist
  - specialist
  - radiologist
  - resident
  temperature: 0.7
  forecast_temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256
  rounds: 2
  forecast_mode: separate
  forecast_include_own_answer: true
  citation_required: false
  deliberation: false
cells:
- H0
- H1
- H2
- H3
- H4
- H5
- SYC
scoring:
  eps: 1.0e-09
  variant: geometric
  forecast_smoothing: 0.01
analysis:
  n_bootstrap: 1000
  bootstrap_seed: 7
  ece_bins: 10
  alpha: 0.05
  rarity_premium_threshold: 0.05
  discrimination_gap_threshold: 0.1
  p5_delta_threshold: 0.15
  p2_delta_threshold: 0.1
  oracle_abs_threshold: 0.05
