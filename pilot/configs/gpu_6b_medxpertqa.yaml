run_name: gpu_6b_medxpertqa
seed: 13
data:
  dataset: medxpertqa
  path: data/cases/medxpertqa_300.jsonl
  limit: 300
backend:
  type: hf
  hf:
    device_map: auto
    dtype: auto
    load_in_4bit: true
    max_loaded_models: 1
    trust_remote_code: false
team:
  agents: 5
  models:
  - 01-ai/Yi-1.5-6B-Chat
  roles:
  - attending physician
  - internist
  - specialist
  - radiologist
  - resident
  temperature: 0.7
  forecast_temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256
  rounds: 2
cells:
- H1
- H4
- H5
- SYC
scoring:
  variant: geometric
  eps: 1.0e-09
analysis:
  n_bootstrap: 1000
  bootstrap_seed: 7
  ece_bins: 10
  alpha: 0.05
  rarity_premium_threshold: 0.05
  discrimination_gap_threshold: 0.1
  p5_delta_threshold: 0.15
  p2_delta_threshold: 0.1
  oracle_abs_threshold: 0.05
output_dir: results/gpu_6b_medxpertqa
