run_name: cpu_pubmedqa
seed: 13

# CPU-friendly config for PubMedQA (the only genuine H4 evidence partition).
# - Uses small models, no 4-bit, float32 on CPU. Very slow compared to GPU.
# - Start small: this default runs 20 cases on H1,H4,H5,SYC.
# - For a quicker check:  --limit 5  --cells H1,H4
# - For a larger run:     --limit 60 --cells H0,H1,H2,H3,H4,H5,SYC
data:
  dataset: pubmedqa
  path: data/cases/pubmedqa_300.jsonl
  limit: 20

backend:
  type: hf
  hf:
    device_map: cpu
    dtype: float32
    load_in_4bit: false
    max_loaded_models: 1
    trust_remote_code: false

team:
  agents: 5
  models:
    - Qwen/Qwen2.5-0.5B-Instruct
    - Qwen/Qwen2.5-1.5B-Instruct
    - Qwen/Qwen2.5-0.5B-Instruct
  roles:
    - attending physician
    - internist
    - specialist
    - radiologist
    - resident
  temperature: 0.7
  forecast_temperature: 0.0
  top_p: 1.0
  max_new_tokens: 160
  rounds: 2

cells:
  - H1
  - H4
  - H5
  - SYC

scoring:
  variant: geometric
  eps: 1.0e-9

analysis:
  n_bootstrap: 500
  bootstrap_seed: 7
  ece_bins: 10
  alpha: 0.05
  rarity_premium_threshold: 0.05
  discrimination_gap_threshold: 0.10
  p5_delta_threshold: 0.15
  p2_delta_threshold: 0.10
  oracle_abs_threshold: 0.05

output_dir: results/cpu_pubmedqa
