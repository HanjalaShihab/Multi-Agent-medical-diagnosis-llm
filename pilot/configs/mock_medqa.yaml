run_name: mock_medqa
seed: 13

# CPU smoke run: mock backend, MedQA subset. Numbers are SMOKE ONLY.
# Download: python scripts/download_data.py medqa --out data/raw/medqa
# Prepare:  python -m bts_audit.cli prepare --dataset medqa --raw data/raw/medqa \
#               --out data/cases/medqa_60.jsonl --n 60
data:
  dataset: medqa
  path: data/cases/medqa_60.jsonl
  limit: 60

backend:
  type: mock
  mock:
    skill: 0.65
    signal_strength: 2.0
    forecast_own_weight: 0.0
    forecast_noise: 0.10
    decoy_strength: 2.4
    pressure_strength: 3.2
    prevalence_weight: 0.0

team:
  agents: 5
  models:
    - mock-a
    - mock-b
    - mock-c
  roles:
    - attending physician
    - internist
    - specialist
    - radiologist
    - resident
  temperature: 0.7
  forecast_temperature: 0.0
  top_p: 1.0
  max_new_tokens: 384
  rounds: 2

cells:
  - H0
  - H1
  - H2
  - H3
  - H4
  - H5
  - SYC

scoring:
  variant: geometric
  eps: 1.0e-9

analysis:
  n_bootstrap: 200
  bootstrap_seed: 7
  ece_bins: 10
  alpha: 0.05
  rarity_premium_threshold: 0.05
  discrimination_gap_threshold: 0.10
  p5_delta_threshold: 0.15
  p2_delta_threshold: 0.10
  oracle_abs_threshold: 0.05

output_dir: results/mock_medqa
