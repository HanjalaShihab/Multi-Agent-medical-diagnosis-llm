run_name: gpu_pubmedqa_3b
seed: 13

# GPU config - ~3B target model (PubMedQA, genuine H4 evidence partition).
# Independent run: use its own --out dir. Do NOT resume into old CPU/small-model dirs.
# Resume works within THIS run: same config + same --out + --resume.
data:
  dataset: pubmedqa
  path: data/cases/pubmedqa_300.jsonl
  limit: 300

backend:
  type: hf
  hf:
    device_map: auto
    dtype: auto          # uses bf16/fp16/fp32 based on GPU support
    load_in_4bit: true   # set false if you have plenty of VRAM and no bitsandbytes issues
    max_loaded_models: 1
    trust_remote_code: false

team:
  agents: 5
  models:
    - Qwen/Qwen2.5-3B-Instruct
  roles:
    - attending physician
    - internist
    - specialist
    - radiologist
    - resident
  temperature: 0.7
  forecast_temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256
  rounds: 2

cells: [H0, H1, H2, H3, H4, H5, SYC]

scoring:
  variant: geometric
  eps: 1.0e-9

analysis:
  n_bootstrap: 1000
  bootstrap_seed: 7
  ece_bins: 10
  alpha: 0.05
  rarity_premium_threshold: 0.05
  discrimination_gap_threshold: 0.10
  p5_delta_threshold: 0.15
  p2_delta_threshold: 0.10
  oracle_abs_threshold: 0.05

output_dir: results/gpu_pubmedqa_3b
