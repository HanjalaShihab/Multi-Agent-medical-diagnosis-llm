run_name: colab_medqa_support
seed: 13

# Supporting run for the thesis (time-limited scope):
# MedQA, 60 cases, H1/H4/H5/SYC only. Small model team; T4 GPU; no API key.
# Own output dir = resume-safe. Do not resume into a different config.
data:
  dataset: medqa
  path: data/cases/medqa_300.jsonl
  limit: 60

backend:
  type: hf
  hf:
    device_map: auto
    dtype: float16
    load_in_4bit: false
    max_loaded_models: 1
    trust_remote_code: false

team:
  agents: 5
  models:
    - Qwen/Qwen2.5-0.5B-Instruct
    - Qwen/Qwen2.5-1.5B-Instruct
    - Qwen/Qwen2.5-0.5B-Instruct
  roles:
    - attending physician
    - internist
    - specialist
    - radiologist
    - resident
  temperature: 0.7
  forecast_temperature: 0.0
  top_p: 1.0
  max_new_tokens: 160
  rounds: 2

cells: [H1, H4, H5, SYC]

scoring:
  variant: geometric
  eps: 1.0e-9

analysis:
  n_bootstrap: 1000
  bootstrap_seed: 7
  ece_bins: 10
  alpha: 0.05
  rarity_premium_threshold: 0.05
  discrimination_gap_threshold: 0.10
  p5_delta_threshold: 0.15
  p2_delta_threshold: 0.10
  oracle_abs_threshold: 0.05

output_dir: results/colab_medqa_support
