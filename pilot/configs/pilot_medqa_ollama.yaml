run_name: medqa_ollama
seed: 13

# MedQA-USMLE on local Ollama models. No API key.
# Download: python scripts/download_data.py medqa --out data/raw/medqa
# Prepare:  python -m bts_audit.cli prepare --dataset medqa --raw data/raw/medqa \
#               --out data/cases/medqa_300.jsonl --n 300
data:
  dataset: medqa
  path: data/cases/medqa_300.jsonl
  limit: 300

backend:
  type: ollama

team:
  agents: 5
  models:
    - qwen2.5:3b
    - llama3.1:8b
    - phi3.5:latest
  roles:
    - attending physician
    - internist
    - specialist
    - radiologist
    - resident
  temperature: 0.7
  forecast_temperature: 0.0
  top_p: 1.0
  max_new_tokens: 384
  rounds: 2

cells:
  - H0
  - H1
  - H2
  - H3
  - H4
  - H5
  - SYC

scoring:
  variant: geometric
  eps: 1.0e-9

analysis:
  n_bootstrap: 1000
  bootstrap_seed: 7
  ece_bins: 10
  alpha: 0.05
  rarity_premium_threshold: 0.05
  discrimination_gap_threshold: 0.10
  p5_delta_threshold: 0.15
  p2_delta_threshold: 0.10
  oracle_abs_threshold: 0.05

output_dir: results/medqa_ollama
